<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스도쿠</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#5b6cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="스도쿠">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 메인(홈) 화면 -->
  <main id="home">
    <header>
      <h1>스도쿠</h1>
      <div class="header-right">
        <div class="stars-badge" title="보유 별">⭐ 0</div>
      </div>
    </header>

    <button id="home-tree-card" class="tree-card" aria-label="정원 열기">
      <div id="home-tree" class="tree"></div>
      <div id="home-tree-name" class="tree-name"></div>
      <div id="home-dots" class="dots"></div>
      <div class="tree-card-hint">눌러서 정원 가기 🌳</div>
    </button>

    <h2 class="section-title">난이도를 선택하세요</h2>
    <div class="levels">
      <button class="level" data-level="easy">
        <span class="level-name">쉬움</span>
        <span class="level-reward">⭐ 1</span>
      </button>
      <button class="level" data-level="medium">
        <span class="level-name">보통</span>
        <span class="level-reward">⭐ 3</span>
      </button>
      <button class="level" data-level="hard">
        <span class="level-name">어려움</span>
        <span class="level-reward">⭐ 5</span>
      </button>
    </div>

    <button id="continue-btn" class="secondary continue" hidden>▶ 이어하기</button>
  </main>

  <!-- 게임 화면 -->
  <main id="game" hidden>
    <header>
      <div class="header-left">
        <button id="home-btn" class="icon-btn" aria-label="홈으로">←</button>
        <h1 id="game-title">스도쿠</h1>
      </div>
      <div class="header-right">
        <div class="stars-badge" title="보유 별">⭐ 0</div>
        <button id="garden-btn" class="icon-btn" aria-label="내 정원">🌳</button>
      </div>
    </header>

    <div class="status">
      <div id="timer">00:00</div>
      <div id="best"></div>
    </div>

    <div id="board"></div>

    <p id="message"></p>

    <div class="actions">
      <button id="notes-toggle" class="secondary">✏️ 메모 OFF (N)</button>
      <button id="hint" class="secondary">💡 힌트 (3)</button>
    </div>

    <div id="numpad"></div>

    <button id="new-game" class="primary">새 게임</button>
  </main>

  <!-- 정원 화면 (열기/닫기) -->
  <div id="garden" class="overlay" hidden>
    <div class="panel">
      <div id="garden-switch" class="garden-switch"></div>

      <div class="tabs">
        <button id="tab-grow-btn" class="tab active">🌱 키우기</button>
        <button id="tab-shop-btn" class="tab">🛒 상점</button>
        <button id="tab-scene-btn" class="tab">🏡 정원</button>
        <button id="tab-status-btn" class="tab">📊 현황</button>
      </div>

      <section id="tab-grow">
        <div id="grow-view">
          <div id="tree" class="tree"></div>
          <div id="tree-name" class="tree-name"></div>
          <div id="grow-target" class="status-note"></div>
          <div id="tree-dots" class="dots"></div>
          <button id="tree-action" class="primary"></button>
        </div>
        <div id="plant-picker" class="picker" hidden></div>
        <p id="garden-msg" class="garden-msg"></p>
        <div id="expand-box" class="expand-box"></div>
      </section>

      <section id="tab-shop" hidden>
        <div id="shop-stars" class="shop-stars"></div>
        <div id="shop-list" class="shop-list"></div>
        <p id="shop-msg" class="garden-msg"></p>
      </section>

      <section id="tab-scene" hidden>
        <div id="scene" class="scene"></div>
        <div id="scene-actions" class="scene-actions"></div>
        <p id="scene-info" class="garden-msg"></p>
      </section>

      <section id="tab-status" hidden>
        <div id="status-body"></div>
      </section>

      <button id="garden-close" class="secondary close">닫기</button>
    </div>
  </div>

  <script src="garden.js"></script>
  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
